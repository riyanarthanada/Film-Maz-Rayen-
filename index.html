<style>
*{box-sizing:border-box}
:root{--accent:#fff;--muted:#a9a9ad;--glass:rgba(15,15,18,.68);--line:rgba(255,255,255,.13)}
body{margin:0;background:#050505;color:#fff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
body:before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(circle at 75% 10%,#454545 0,transparent 30%),linear-gradient(145deg,#171717,#030303 62%);transition:.4s}
body.custom-bg:before{background-image:var(--custom-bg);background-size:cover;background-position:center;filter:brightness(.38)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.wrap{max-width:1450px;margin:auto;padding:18px 34px 55px}
.topbar{height:46px;display:flex;align-items:center;justify-content:space-between}
.brand{font-weight:900;letter-spacing:.5px;font-size:18px}
.top-actions{display:flex;gap:8px}
.iconbtn,.ghost{background:rgba(255,255,255,.08);border:1px solid var(--line);color:#fff;border-radius:999px;padding:9px 13px}
.hero{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(290px,.8fr);gap:18px;margin-top:8px}
.hero-main{min-height:360px;border-radius:30px;overflow:hidden;position:relative;background:linear-gradient(90deg,#111 5%,transparent 75%),linear-gradient(0deg,rgba(0,0,0,.8),transparent 55%);border:1px solid var(--line)}
.hero-main.hasimg{background-size:cover;background-position:center}
.hero-content{position:absolute;left:30px;bottom:28px;max-width:72%}
.kicker{font-size:13px;color:#ddd;margin-bottom:6px}
h1{font-size:clamp(28px,4vw,52px);line-height:1;margin:0 0 12px}
.hero-meta{color:#ddd;font-size:13px}
.play{margin-top:18px;border:0;border-radius:50%;width:58px;height:58px;background:#fff;color:#111;font-size:24px}
.side{background:var(--glass);border:1px solid var(--line);border-radius:28px;padding:20px;backdrop-filter:blur(16px)}
.side h3{margin:0 0 15px}
.mini{display:flex;gap:12px;align-items:center;padding:9px;border-radius:15px}
.mini:hover{background:rgba(255,255,255,.07)}
.mini-poster{width:70px;height:48px;border-radius:9px;background:linear-gradient(135deg,#4a4a4a,#151515);background-size:cover;background-position:center;flex:none}
.mini-info{min-width:0}.mini-title{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mini-meta{font-size:11px;color:var(--muted);margin-top:4px}
.section{margin-top:22px}.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.section-head h2{font-size:18px;margin:0}
.genrebar{display:flex;gap:8px;overflow:auto;padding-bottom:3px}.pill{white-space:nowrap;border:1px solid var(--line);background:rgba(255,255,255,.05);color:#ddd;border-radius:999px;padding:8px 13px}.pill.active{background:#fff;color:#111}
.trending{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(145px,1fr);grid-template-rows:1fr;gap:13px;overflow-x:auto;padding-bottom:7px}
.poster-card{min-width:145px;height:220px;border-radius:16px;overflow:hidden;position:relative;background:linear-gradient(145deg,#444,#111);border:1px solid var(--line);cursor:pointer}
.poster-card .poster-img{position:absolute;inset:0;background-size:cover;background-position:center}
.poster-card:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.9),transparent 55%)}
.poster-title{position:absolute;z-index:2;bottom:12px;left:11px;right:11px;font-size:13px;font-weight:800;line-height:1.15}
.poster-year{position:absolute;z-index:2;top:9px;left:9px;font-size:10px;background:rgba(0,0,0,.65);padding:5px 7px;border-radius:8px}
.toolbar{display:flex;gap:9px;flex-wrap:wrap}.search{flex:1;min-width:230px}.search,input,select,textarea{background:#101014;color:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 13px;outline:none}.library{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:13px}.rowcard{background:rgba(16,16,19,.78);border:1px solid var(--line);border-radius:17px;padding:14px;cursor:pointer}.rowcard:hover{border-color:rgba(255,255,255,.35);transform:translateY(-2px);transition:.15s}.rowtitle{font-weight:800}.rowmeta{font-size:12px;color:var(--muted);margin-top:6px}.tag{display:inline-block;margin-top:9px;margin-right:5px;font-size:10px;color:#ddd;background:#252529;border-radius:999px;padding:4px 7px}
dialog{width:min(650px,92vw);border:1px solid var(--line);border-radius:22px;background:#111;color:#fff;padding:0;box-shadow:0 25px 100px #000}
dialog::backdrop{background:rgba(0,0,0,.72);backdrop-filter:blur(5px)}
.detail{padding:24px}.detail-poster{height:250px;border-radius:16px;background:linear-gradient(135deg,#333,#111);background-size:cover;background-position:center;margin-bottom:18px}.detail h2{margin:0 0 7px;font-size:30px}.detail-meta{color:#aaa}.detail-note{white-space:pre-wrap;background:#18181c;border-radius:13px;padding:13px;margin:15px 0;color:#ddd;line-height:1.5}.detail-links{display:flex;gap:8px;flex-wrap:wrap}.detail-links a{color:#111;background:#fff;text-decoration:none;padding:10px 13px;border-radius:11px;font-weight:700}
.form{padding:24px;display:grid;gap:12px}.form h2{margin:0}.form label{display:grid;gap:6px;color:#aaa;font-size:13px}.form button{background:#fff;color:#111;border:0;border-radius:11px;padding:12px;font-weight:800}
.filebtn{display:inline-block;background:#fff;color:#111;border-radius:999px;padding:9px 13px;font-size:13px;font-weight:700;cursor:pointer}.filebtn input{display:none}
.empty{padding:30px;color:#999;text-align:center}
@media(max-width:850px){.hero{grid-template-columns:1fr}.side{display:none}.hero-main{min-height:320px}.wrap{padding:14px 16px 45px}}
@media(max-width:520px){.trending{grid-auto-columns:130px}.poster-card{height:195px}.library{grid-template-columns:repeat(2,minmax(0,1fr))}.rowcard{padding:11px}.hero-content{left:20px;bottom:20px;max-width:90%}}
</style>
</head>

let films=initial.map(x=>({...x})), watched=new Set(JSON.parse(localStorage.getItem("filmMazWatched")||"[]"));
let selected=null, activeGenre="";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl=u=>/^https?:\/\//i.test(String(u||""))?String(u):"";
function allGenres(){return [...new Set(films.flatMap(f=>(f.genre||"").split(",").map(x=>x.trim()).filter(Boolean)))].sort()}
function posterStyle(f){let u=safeUrl(f.imageLink);return u?`background-image:url("${esc(u)}")`:""}
function chooseHero(){
 let f=films.find(x=>watched.has(x.id))||films[0]; if(!f)return;
 $("hero").classList.toggle("hasimg",!!safeUrl(f.imageLink)); $("hero").style.backgroundImage=safeUrl(f.imageLink)?`linear-gradient(90deg,rgba(0,0,0,.75),transparent 75%),url("${f.imageLink}")`:"";
 $("heroYear").textContent=f.year||"";
 $("heroTitle").textContent=f.title;
 $("heroMeta").textContent=[f.rating?"⭐ "+f.rating:"",f.genre].filter(Boolean).join("  •  ");
 $("heroPlay").onclick=()=>f.watchLink?window.open(f.watchLink,"_blank"):openDetail(f.id);
}
function renderGenres(){
 $("genres").innerHTML=`<button class="pill ${!activeGenre?"active":""}" onclick="setGenre('')">Semua</button>`+allGenres().map(g=>`<button class="pill ${activeGenre===g?"active":""}" onclick="setGenre('${esc(g)}')">${esc(g)}</button>`).join("");
}
function setGenre(g){activeGenre=g;renderGenres();renderLibrary()}
function openDetail(id){
 selected=id; let f=films.find(x=>x.id===id); if(!f)return;
 $("detailPoster").style.backgroundImage=safeUrl(f.imageLink)?`url("${f.imageLink}")`:"linear-gradient(135deg,#333,#111)";
 $("dTitle").textContent=f.title;
 $("dMeta").textContent=[f.year?"Tahun "+f.year:"",f.rating?"⭐ Rating "+f.rating:"",f.watchDate?"🗓 "+f.watchDate:""].filter(Boolean).join("  •  ");
 $("dGenres").innerHTML=(f.genre||"").split(",").filter(Boolean).map(g=>`<span class="tag">${esc(g.trim())}</span>`).join("");
 $("dNote").textContent=f.note||"Belum ada catatan.";
 $("dLinks").innerHTML=(f.watchLink?`<a href="${esc(f.watchLink)}" target="_blank" rel="noopener">▶ Tempat Nonton</a>`:"")+(f.imageLink?`<a href="${esc(f.imageLink)}" target="_blank" rel="noopener">🖼 Buka Gambar</a>`:"");
 $("dEdit").onclick=()=>{detailDlg.close();openForm(f)};
 detailDlg.showModal();
}
function renderNow(){
 let list=[...films].filter(f=>watched.has(f.id)).slice(0,4);
 if(!list.length)list=films.slice(0,4);
 $("nowList").innerHTML=list.map(f=>`<div class="mini" onclick="openDetail(${f.id})"><div class="mini-poster" style="${posterStyle(f)}"></div><div class="mini-info"><div class="mini-title">${esc(f.title)}</div><div class="mini-meta">${f.year||""}${f.rating?" • ⭐ "+esc(f.rating):""}</div></div></div>`).join("");
}
function renderTrending(){
 let list=films.slice(0,14);
 $("trending").innerHTML=list.map(f=>`<div class="poster-card" onclick="openDetail(${f.id})"><div class="poster-img" style="${posterStyle(f)}"></div><div class="poster-year">${esc(f.year||"—")}</div><div class="poster-title">${esc(f.title)}</div></div>`).join("");
}
function renderLibrary(){
 let q=$("search").value.toLowerCase(), st=$("status").value;
 let a=films.filter(f=>(f.title+" "+f.note+" "+f.franchise+" "+f.genre).toLowerCase().includes(q)&&(!activeGenre||(f.genre||"").split(",").map(x=>x.trim()).includes(activeGenre))&&(!st||(st==="watched"?watched.has(f.id):!watched.has(f.id))));
 let sort=$("sort").value;a.sort((x,y)=>sort==="az"?x.title.localeCompare(y.title):sort==="za"?y.title.localeCompare(x.title):sort==="year"?(Number(y.year)||0)-(Number(x.year)||0):(Number(y.rating)||0)-(Number(x.rating)||0));
 $("count").textContent=a.length+" film";
 $("library").innerHTML=a.length?a.map(f=>`<div class="rowcard" onclick="openDetail(${f.id})"><div class="rowtitle">${esc(f.title)}</div><div class="rowmeta">${f.year||"Tahun—"} ${f.rating?"• ⭐ "+esc(f.rating):""} ${watched.has(f.id)?"• ✓ Ditonton":""}</div>${(f.genre||"").split(",").slice(0,3).filter(Boolean).map(g=>`<span class="tag">${esc(g.trim())}</span>`).join("")}</div>`).join(""):`<div class="empty">Film tidak ditemukan.</div>`;
}
function render(){renderGenres();renderNow();renderTrending();renderLibrary();chooseHero()}
function openForm(f=null){
 $("formTitle").textContent=f?"Edit Film":"Tambah Film";
 $("fTitle").value=f?.title||"";$("fYear").value=f?.year||"";$("fRating").value=f?.rating||"";$("fGenre").value=f?.genre||"";$("fWatchDate").value=f?.watchDate||"";$("fWatchLink").value=f?.watchLink||"";$("fImageLink").value=f?.imageLink||"";$("fFranchise").value=f?.franchise||"";$("fNote").value=f?.note||"";
 $("filmForm").dataset.id=f?.id||"";formDlg.showModal();
}
$("filmForm").onsubmit=e=>{e.preventDefault();let id=Number(e.target.dataset.id), x={id:id||Math.max(0,...films.map(f=>f.id))+1,title:$("fTitle").value.trim(),year:$("fYear").value,rating:$("fRating").value,genre:$("fGenre").value,watchDate:$("fWatchDate").value,watchLink:$("fWatchLink").value.trim(),imageLink:$("fImageLink").value.trim(),franchise:$("fFranchise").value,note:$("fNote").value};films=id?films.map(f=>f.id===id?x:f):[...films,x];formDlg.close();render()};
$("add").onclick=()=>openForm();
["search","status","sort"].forEach(id=>$(id).oninput=renderLibrary);
$("bgFile").onchange=e=>{let file=e.target.files[0];if(!file)return;let reader=new FileReader();reader.onload=()=>{document.body.style.setProperty("--custom-bg",`url("${reader.result}")`);document.body.classList.add("custom-bg");localStorage.setItem("filmMazBg",reader.result)};reader.readAsDataURL(file)};
$("resetBg").onclick=()=>{document.body.classList.remove("custom-bg");document.body.style.removeProperty("--custom-bg");localStorage.removeItem("filmMazBg")};
let savedBg=localStorage.getItem("filmMazBg");if(savedBg){document.body.style.setProperty("--custom-bg",`url("${savedBg}")`);document.body.classList.add("custom-bg")}
render();
